name: Build FHIR IG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      IG_TOOLBOX_IMAGE: ghcr.io/bonfhir/ig-toolbox:23382ec329204d4d26d3e9f79f3da40d86207b82

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare cache directories
        run: |
          mkdir -p .fhir/packages
          mkdir -p input-cache

      - name: Cache FHIR packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            fhir-packages-${{ runner.os }}-

      - name: Cache IG Publisher input-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: input-cache
          key: ig-publisher-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            ig-publisher-${{ runner.os }}-

      - name: Pull IG toolbox Docker image
        run: |
          docker pull "$IG_TOOLBOX_IMAGE"

      - name: Build IG with Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspaces" \
            -v "$PWD/.fhir:/root/.fhir" \
            -w /workspaces \
            "$IG_TOOLBOX_IMAGE" \
            sushi

      - name: Update Publisher with Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspaces" \
            -v "$PWD/.fhir:/root/.fhir" \
            -w /workspaces \
            "$IG_TOOLBOX_IMAGE" \
            ./_updatePublisher.sh -y

      - name: Run Publisher with Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspaces" \
            -v "$PWD/.fhir:/root/.fhir" \
            -w /workspaces \
            "$IG_TOOLBOX_IMAGE" \
            ./_genonce.sh

      - name: Fix Docker-created file permissions
        if: always()
        run: |
          sudo chown -R "$USER:$USER" .fhir input-cache output fsh-generated 2>/dev/null || true
          chmod -R u+rwX .fhir input-cache output fsh-generated 2>/dev/null || true

      - name: Verify expected IG output
        if: success()
        run: |
          test -d output
          test -f output/qa.html

      - name: Upload output as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          if-no-files-found: warn
          name: ig-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 30

      - name: Upload QA report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          if-no-files-found: warn
          name: qa-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/qa.html
          retention-days: 30

      - name: Report QA artifact status
        if: always()
        run: |
          if [ -f output/qa.html ]; then
            ERROR_COUNT=$(grep -oi 'errors' output/qa.html | wc -l || true)
            echo "QA report generated. Found ${ERROR_COUNT} occurrence(s) of the word 'errors'."
            echo "Check the qa-report artifact for details."
          else
            echo "QA report was not generated."
          fi

