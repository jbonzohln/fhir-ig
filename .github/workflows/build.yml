name: Build FHIR IG

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby + Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll bundler

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.fhir/packages
          mkdir -p input-cache

      - name: Cache FHIR packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            fhir-packages-${{ runner.os }}-

      - name: Cache IG publisher input-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: input-cache
          key: ig-publisher-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            ig-publisher-${{ runner.os }}-

      - name: Download IG Publisher
        if: ${{ hashFiles('input-cache/publisher.jar') == '' }}
        run: |
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Run IG Publisher
        run: bash ./_genonce.sh
