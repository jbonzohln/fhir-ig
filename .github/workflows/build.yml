name: Build FHIR IG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache directories
        run: |
          mkdir -p .fhir/packages

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: .fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml', 'ig.ini') }}
          restore-keys: |
            fhir-packages-

      - name: Build IG with Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspaces" \
            -v "$PWD/.fhir:/root/.fhir" \
            -w /workspaces \
            ghcr.io/bonfhir/ig-toolbox:latest \
            sushi

      - name: Update Publisher with Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspaces" \
            -v "$PWD/.fhir:/root/.fhir" \
            -w /workspaces \
            ghcr.io/bonfhir/ig-toolbox:latest \
            ./_updatePublisher.sh -y

      - name: Run Publisher with Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspaces" \
            -v "$PWD/.fhir:/root/.fhir" \
            -w /workspaces \
            ghcr.io/bonfhir/ig-toolbox:latest \
            ./_genonce.sh

      - name: Fix Docker-created file permissions
        if: always()
        run: |
          sudo chown -R "$USER:$USER" .fhir input-cache output fsh-generated 2>/dev/null || true
          chmod -R u+rwX .fhir input-cache output fsh-generated 2>/dev/null || true

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: ig-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: ig-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: qa-report-${{ github.run_number }}
          path: output/qa.html
          retention-days: 30

      - name: Report QA artifact status
        if: always()
        run: |
          if [ -f output/qa.html ]; then
            ERROR_COUNT=$(grep -oi 'errors' output/qa.html | wc -l || true)
            echo "QA report generated. Found ${ERROR_COUNT} occurrence(s) of the word 'errors'."
            echo "Check the qa-report artifact for details."
          else
            echo "QA report was not generated."
          fi

