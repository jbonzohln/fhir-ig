name: Build FHIR IG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml', 'ig.ini', 'package.json', 'package-lock.json') }}
          restore-keys: |
            fhir-packages-

      - name: Install SUSHI
        run: npm install -g fsh-sushi@3.14.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Add Bundler binstubs to PATH
        run: |
          bundle config set bin .bundle/bin
          bundle binstubs jekyll
          echo "$PWD/.bundle/bin" >> "$GITHUB_PATH"

      - name: Check Jekyll
        run: |
          which jekyll
          jekyll --version

      - name: Download IG Publisher
        run: |
          set -euo pipefail

          PUBLISHER_URL="https://github.com/HL7/fhir-ig-publisher/releases/download/2.2.8/publisher.jar"
          PUBLISHER_SHA256="4eafde1dfb52c785d6b5998c34bcdc19791602f2685e2a1427cc6df98c7d27c6"

          mkdir -p input-cache
          if [ ! -f input-cache/publisher.jar ]; then
            curl --fail --show-error --silent --location \
              "${PUBLISHER_URL}" \
              --output input-cache/publisher.jar
          fi

          if ! echo "${PUBLISHER_SHA256}  input-cache/publisher.jar" | sha256sum -c -; then
            echo "Publisher hash mismatch. Re-downloading..."
            rm -f input-cache/publisher.jar
            curl --fail --show-error --silent --location \
              "${PUBLISHER_URL}" \
              --output input-cache/publisher.jar
            echo "${PUBLISHER_SHA256}  input-cache/publisher.jar" | sha256sum -c -
          fi

      - name: Run SUSHI
        run: sushi .

      - name: Run IG Publisher
        run: |
          java -jar input-cache/publisher.jar \
            -ig ig.ini \
            -tx https://tx.fhir.org/r4 \
            -no-sushi

      - name: Verify IG output exists
        run: |
          test -d output
          test -f output/index.html

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: ig-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: qa-report-${{ github.run_number }}
          path: output/qa.html
          retention-days: 30

      - name: Report QA artifact status
        if: always()
        run: |
          if [ -f output/qa.html ]; then
            ERROR_COUNT=$(grep -oi 'errors' output/qa.html | wc -l || true)
            echo "QA report generated. Found ${ERROR_COUNT} occurrence(s) of the word 'errors'."
            echo "Check the qa-report artifact for details."
          else
            echo "QA report was not generated."
          fi

  deploy-pages:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output-${{ github.run_number }}
          path: output/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
