name: Build FHIR IG

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Setup Ruby + Jekyll
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: '4.0'
      - run: |
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> $GITHUB_PATH
      - run: gem install --user-install bundler jekyll

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.fhir/packages
          mkdir -p input-cache

      - name: Cache FHIR packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            fhir-packages-${{ runner.os }}-

      - name: Cache IG publisher input-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: input-cache
          key: ig-publisher-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            ig-publisher-${{ runner.os }}-

      - name: Download IG Publisher
        if: ${{ hashFiles('input-cache/publisher.jar') == '' }}
        run: bash _updatePublisher.sh -y

      - name: Run IG Publisher
        run: bash ./_genonce.sh

      - name: Upload output as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          if-no-files-found: error
          name: ig-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 30
