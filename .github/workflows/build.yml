name: Build FHIR IG

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Setup Ruby 4.0
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601
        with:
          ruby-version: '4.0'

      - name: Install required tools (jekyll, sushi)
        run: |
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> $GITHUB_PATH
          bundle install
          npm install -g fsh-sushi@3.19.0

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.fhir/packages
          mkdir -p input-cache

      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            fhir-packages-${{ runner.os }}-

      - name: Cache IG publisher input-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: input-cache
          key: ig-publisher-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            ig-publisher-${{ runner.os }}-

      - name: Download IG Publisher
        if: ${{ hashFiles('input-cache/publisher.jar') == '' }}
        run: bash _updatePublisher.sh -y

      - name: Verify publisher.jar SHA256 for version 2.3.0
        run: |
          EXPECTED="e842f2186117d9e41be457949e6a13e69a8d8590a680b6f3cf48a20f87bdabbd"
          FILE="input-cache/publisher.jar"
          if [ ! -f "$FILE" ]; then
            echo "publisher.jar not found at $FILE" >&2
            exit 1
          fi
          ACTUAL=$(sha256sum "$FILE" | awk '{print $1}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "SHA256 mismatch for $FILE" >&2
            exit 1
          fi

      - name: Run IG Publisher
        run: bash ./_genonce.sh

      - name: Upload output as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          if-no-files-found: error
          name: ig-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/full-ig.zip
          retention-days: 7
