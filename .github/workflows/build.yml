name: Build FHIR IG

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Setup Ruby 4.0
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '4.0'

      - name: Install required tools (jekyll, sushi)
        run: |
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> $GITHUB_PATH
          bundle install
          npm install -g fsh-sushi@3.19.0

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.fhir/packages
          mkdir -p input-cache

      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            fhir-packages-${{ runner.os }}-

      - name: Cache IG publisher input-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: input-cache
          key: ig-publisher-${{ runner.os }}-${{ hashFiles('sushi-config.yaml', 'sushi-config.yml', 'ig.ini', 'package-list.json') }}
          restore-keys: |
            ig-publisher-${{ runner.os }}-

      - name: Download IG Publisher
        run: bash _updatePublisher.sh -y || true

      - name: Run IG Publisher
        run: bash ./_genonce.sh

      - name: Upload output as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          if-no-files-found: error
          name: ig-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/full-ig.zip
          retention-days: 7
